name: Build release JAR

on:
  push:
    tags:
      - '[0-9]*.[0-9]*.[0-9]*'
      - 'v[0-9]*.[0-9]*.[0-9]*'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '17'

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'

      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0

      - name: Check release tag matches the mod version
        if: github.ref_type == 'tag'
        run: |
          python3 - <<'PY'
          import os
          import re
          import tomllib
          from pathlib import Path
          tag = os.environ['GITHUB_REF_NAME'].removeprefix('v')
          metadata = tomllib.loads(Path('src/main/resources/META-INF/mods.toml').read_text())
          version = metadata['mods'][0]['version']
          build_version = re.search(r"^version = '([^']+)'$", Path('build.gradle').read_text(), re.MULTILINE).group(1)
          if tag != version or tag != build_version:
              raise SystemExit(f'Tag {tag}, mod version {version}, and Gradle version {build_version} must match')
          PY

      - name: Download and verify pinned mod dependencies
        run: python3 scripts/prepare_dependencies.py --download

      - name: Build, run feature checks, and verify production packaging
        run: ./gradlew --no-daemon build

      - name: Generate checksums
        working-directory: build/libs
        run: sha256sum gtmultiblocklocator-*.jar > SHA256SUMS

      - name: Upload release JAR and checksums
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: gtmultiblocklocator-${{ github.ref_name }}
          path: |
            build/libs/gtmultiblocklocator-*.jar
            build/libs/SHA256SUMS
          if-no-files-found: error
          retention-days: 90

      - name: Attach JAR and checksums to GitHub Release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          if gh release view "$RELEASE_TAG" --repo "$GH_REPO" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" build/libs/gtmultiblocklocator-*.jar build/libs/SHA256SUMS \
              --repo "$GH_REPO" --clobber
          else
            gh release create "$RELEASE_TAG" build/libs/gtmultiblocklocator-*.jar build/libs/SHA256SUMS \
              --repo "$GH_REPO" --verify-tag \
              --title "GregTech Multiblock Locator ${RELEASE_TAG#v}" --generate-notes
          fi
