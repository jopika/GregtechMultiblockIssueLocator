buildscript {
    repositories { maven { url = 'https://repo.spongepowered.org/repository/maven-public/' } }
    dependencies { classpath 'org.spongepowered:mixingradle:0.7.38' }
}
plugins {
    id 'java'
    id 'net.minecraftforge.gradle' version '6.0.54'
}
apply plugin: 'org.spongepowered.mixin'
version = '1.0.0'
group = 'io.github.jopika.gtmultiblocklocator'
base { archivesName = 'gtmultiblocklocator' }
java.toolchain.languageVersion = JavaLanguageVersion.of(17)
minecraft {
    mappings channel: 'official', version: '1.20.1'
    runs {
        client { workingDirectory project.file('run'); mods { gtmultiblocklocator { source sourceSets.main } } }
        server { workingDirectory project.file('run-server'); args '--nogui'; mods { gtmultiblocklocator { source sourceSets.main } } }
    }
}
repositories {
    flatDir { dirs 'libs' }
    mavenCentral()
    maven { url = 'https://repo.spongepowered.org/repository/maven-public/' }
}
dependencies {
    minecraft 'net.minecraftforge:forge:1.20.1-47.4.20'
    compileOnly fg.deobf('local:gtceu-st:1.20.1-1.7.1c')
    compileOnly fg.deobf('local:ldlib-forge:1.20.1-1.0.52.a')
    // Supply the installed mods for a development client; never bundle them.
    runtimeOnly fg.deobf('local:gtceu-st:1.20.1-1.7.1c')
    runtimeOnly fg.deobf('local:ldlib-forge:1.20.1-1.0.52.a')
    annotationProcessor 'org.spongepowered:mixin:0.8.5:processor'
}
mixin {
    add sourceSets.main, 'gtmultiblocklocator.refmap.json'
    config 'gtmultiblocklocator.mixins.json'
}
tasks.withType(JavaCompile).configureEach { options.encoding = 'UTF-8' }
tasks.named('jar', Jar) {
    manifest.attributes('MixinConfigs': 'gtmultiblocklocator.mixins.json')
    from('LICENSE')
    preserveFileTimestamps = false
    reproducibleFileOrder = true
    finalizedBy 'reobfJar'
}
tasks.register('verifyDependencies', Exec) {
    commandLine 'python3', 'scripts/prepare_dependencies.py', '--check'
}
tasks.named('compileJava') { dependsOn 'verifyDependencies' }
tasks.register('featureChecks', JavaExec) {
    dependsOn 'testClasses'
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'io.github.jopika.gtmultiblocklocator.client.FeatureChecks'
}
tasks.named('check') { dependsOn 'featureChecks' }
tasks.register('verifyArtifact', Exec) {
    dependsOn 'reobfJar'
    commandLine 'python3', 'scripts/verify_artifact.py'
}
tasks.named('build') { finalizedBy 'verifyArtifact' }
